name: Build and deploy tagged OpenClaw release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Confirm deployment of this version tag to production
        required: true
        type: boolean
        default: false

concurrency:
  group: openclaw-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: openclaw-platform

jobs:
  build-package:
    name: Build and package
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: openclaw-platform

    steps:
      - name: Check out version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag like v1.2.3; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openclaw-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Package release source
        working-directory: .
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/openclaw-platform-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "${archive}" \
            --exclude="openclaw-platform/.env" \
            --exclude="openclaw-platform/.secrets" \
            --exclude="openclaw-platform/.openclaw-home" \
            --exclude="openclaw-platform/openclaw-obsidian-vault" \
            --exclude="openclaw-platform/node_modules" \
            -C "${GITHUB_WORKSPACE}" openclaw-platform
          echo "Created ${archive}"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-platform-${{ github.ref_name }}
          path: ${{ runner.temp }}/openclaw-platform-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to VPS
    if: >-
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      (github.event_name == 'push' || inputs.deploy_production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-package
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/openclaw-platform' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      OPENCLAW_ENV_FILE: ${{ secrets.OPENCLAW_ENV_FILE }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: openclaw-platform-${{ github.ref_name }}
          path: release

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST}" ]; then
            echo "Missing GitHub secret: VPS_HOST" >&2
            exit 1
          fi
          if [ -z "${SSHPASS}" ] && [ -z "${VPS_SSH_KEY}" ]; then
            echo "Missing GitHub secret: set VPS_SSH_KEY or VPS_PASSWORD" >&2
            exit 1
          fi

      - name: Install deployment tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync sshpass openssh-client

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${VPS_PORT}" "${VPS_HOST}" >> ~/.ssh/known_hosts

          if [ -n "${VPS_SSH_KEY}" ]; then
            printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/vps_deploy_key
            chmod 600 ~/.ssh/vps_deploy_key
            {
              echo 'SSH_AUTH_PREFIX='
              echo 'RSYNC_AUTH_PREFIX='
              echo "SSH_COMMAND=ssh -i ${HOME}/.ssh/vps_deploy_key -o IdentitiesOnly=yes -p ${VPS_PORT}"
            } >> "${GITHUB_ENV}"
          else
            {
              echo 'SSH_AUTH_PREFIX=sshpass -e'
              echo 'RSYNC_AUTH_PREFIX=sshpass -e'
              echo "SSH_COMMAND=ssh -p ${VPS_PORT}"
            } >> "${GITHUB_ENV}"
          fi

      - name: Create deploy directory
        run: |
          set -euo pipefail
          ${SSH_AUTH_PREFIX} ${SSH_COMMAND} "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '${VPS_DEPLOY_PATH}' '${VPS_DEPLOY_PATH}/.secrets'"

      - name: Upload release package
        run: |
          set -euo pipefail
          archive="release/openclaw-platform-${GITHUB_REF_NAME}.tar.gz"
          ${RSYNC_AUTH_PREFIX} rsync -az -e "${SSH_COMMAND}" "${archive}" \
            "${VPS_USER}@${VPS_HOST}:/tmp/openclaw-platform-${GITHUB_REF_NAME}.tar.gz"

      - name: Write runtime secrets
        run: |
          set -euo pipefail
          if [ -n "${OPENCLAW_ENV_FILE}" ]; then
            printf '%s' "${OPENCLAW_ENV_FILE}" | ${SSH_AUTH_PREFIX} ${SSH_COMMAND} "${VPS_USER}@${VPS_HOST}" \
              "cat > '${VPS_DEPLOY_PATH}/.env'"
          fi
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" | ${SSH_AUTH_PREFIX} ${SSH_COMMAND} "${VPS_USER}@${VPS_HOST}" \
              "cat > '${VPS_DEPLOY_PATH}/.secrets/service-account.json'"
          fi

      - name: Install runtime prerequisites and restart gateway
        run: |
          set -euo pipefail
          ${SSH_AUTH_PREFIX} ${SSH_COMMAND} "${VPS_USER}@${VPS_HOST}" \
            "VPS_DEPLOY_PATH='${VPS_DEPLOY_PATH}' RELEASE_TAG='${GITHUB_REF_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${VPS_DEPLOY_PATH}"

          run_as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              echo "Root or sudo is required to install Docker dependencies." >&2
              exit 1
            fi
          }

          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "Docker Compose is missing and this host does not use apt-get." >&2
              exit 1
            fi
            run_as_root apt-get update
            run_as_root apt-get install -y --no-install-recommends make git docker.io docker-compose-plugin \
              || run_as_root apt-get install -y --no-install-recommends make git docker.io docker-compose-v2
            run_as_root systemctl enable --now docker || true
          fi

          if ! command -v git >/dev/null 2>&1; then
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "git is missing and this host does not use apt-get." >&2
              exit 1
            fi
            run_as_root apt-get update
            run_as_root apt-get install -y --no-install-recommends git
          fi

          archive="/tmp/openclaw-platform-${RELEASE_TAG}.tar.gz"
          if [ ! -f "${archive}" ]; then
            echo "Release package ${archive} was not uploaded." >&2
            exit 1
          fi
          if ! tar -tzf "${archive}" >/dev/null; then
            echo "Release package ${archive} is not a valid tar archive." >&2
            exit 1
          fi
          if [ ! -f .env ]; then
            echo "Missing ${VPS_DEPLOY_PATH}/.env. Add OPENCLAW_ENV_FILE as a GitHub secret or create .env on the VPS." >&2
            exit 1
          fi

          find "${VPS_DEPLOY_PATH}" -mindepth 1 -maxdepth 1 \
            ! -name ".env" \
            ! -name ".secrets" \
            ! -name ".openclaw-home" \
            ! -name "openclaw-obsidian-vault" \
            -exec rm -rf -- {} +

          tar -xzf "${archive}" -C "${VPS_DEPLOY_PATH}" --strip-components=1
          rm -f "${archive}"

          mkdir -p .openclaw-home/.openclaw .secrets

          memory_vault_path="$(awk -F= '$1 == "OPENCLAW_MEMORY_VAULT_PATH" {print substr($0, index($0, $2))}' .env | tail -n 1 | sed -e 's/^"//' -e 's/"$//')"
          if [ -n "${memory_vault_path}" ]; then
            mkdir -p "${memory_vault_path}/memory/wishlists" "${memory_vault_path}/memory/receipts"
            if ! git -C "${memory_vault_path}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git -C "${memory_vault_path}" init
            fi
            git -C "${memory_vault_path}" config user.name "OpenClaw Memory"
            git -C "${memory_vault_path}" config user.email "openclaw-memory@local"
          fi

          if [ -f config/openclaw.config.json ]; then
            cp config/openclaw.config.json .openclaw-home/.openclaw/openclaw.json
            sed -i \
              -e "s#/Users/nurrizky/dev/chief-of-staff/openclaw-platform/hooks#/app/hooks#g" \
              -e "s#/Users/nurrizky/dev/chief-of-staff/openclaw-platform/plugins/task-gate#/app/plugins/task-gate#g" \
              .openclaw-home/.openclaw/openclaw.json
          fi

          if [ -f .secrets/service-account.json ]; then
            export GOOGLE_APPLICATION_CREDENTIALS=./.secrets/service-account.json
          fi

          compose() {
            if docker compose version >/dev/null 2>&1; then
              docker compose "$@"
            elif command -v sudo >/dev/null 2>&1 && sudo docker compose version >/dev/null 2>&1; then
              sudo docker compose "$@"
            else
              echo "Docker Compose is not available for this user." >&2
              exit 1
            fi
          }

          compose build gateway
          compose up -d gateway finance-sheet-sync
          compose ps
          REMOTE
