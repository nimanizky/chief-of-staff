services:
  workspace-migrate:
    build: .
    image: chief-openclaw-gateway:local
    command: ["node", "/app/migrate-workspace.mjs"]
    environment:
      OPENCLAW_LEGACY_STATE_DIR: /legacy-state
      OPENCLAW_WORKSPACE_DIR: /workspace
      OPENCLAW_ALLOW_EMPTY_LEGACY_WORKSPACE: ${OPENCLAW_ALLOW_EMPTY_LEGACY_WORKSPACE:-false}
    volumes:
      - openclaw-state:/legacy-state
      - openclaw-workspace:/workspace
    restart: "no"

  memory-sync-init:
    build:
      context: ./memory-sync
    image: chief-openclaw-memory-sync:local
    command: ["node", "/app/sync.mjs", "bootstrap"]
    environment:
      MEMORY_SYNC_WORKSPACE_DIR: /workspace
      MEMORY_SYNC_REMOTE: git@github.com:nimanizky/openclaw-obsidian-vault.git
      MEMORY_SYNC_BRANCH: main
      MEMORY_SYNC_SSH_KEY_FILE: /run/secrets/obsidian-vault-deploy-key
      MEMORY_SYNC_AUTHOR_NAME: OpenClaw Memory Sync
      MEMORY_SYNC_AUTHOR_EMAIL: openclaw-memory-sync@users.noreply.github.com
    volumes:
      - openclaw-workspace:/workspace
      - ../secrets:/run/secrets:ro
    depends_on:
      workspace-migrate:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  gateway:
    build: .
    image: chief-openclaw-gateway:local
    env_file: ${GATEWAY_ENV_PATH:-.env}
    environment:
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /workspace
      # Bind inside the container; host access is restricted to loopback below.
      MCP_BIND_HOST: 0.0.0.0
    volumes:
      - openclaw-state:/home/node/.openclaw
      - openclaw-workspace:/workspace
    expose:
      - "3200"
    ports:
      # Host-level reverse proxies can reach MCP without publishing it publicly.
      - "127.0.0.1:${MCP_HOST_PORT:-3200}:3200"
    depends_on:
      memory-sync-init:
        condition: service_completed_successfully
    networks: [services, browser-network]
    restart: unless-stopped

  memory-sync:
    build:
      context: ./memory-sync
    image: chief-openclaw-memory-sync:local
    environment:
      MEMORY_SYNC_WORKSPACE_DIR: /workspace
      MEMORY_SYNC_REMOTE: git@github.com:nimanizky/openclaw-obsidian-vault.git
      MEMORY_SYNC_BRANCH: main
      MEMORY_SYNC_INTERVAL_SECONDS: ${MEMORY_SYNC_INTERVAL_SECONDS:-60}
      MEMORY_SYNC_SSH_KEY_FILE: /run/secrets/obsidian-vault-deploy-key
      MEMORY_SYNC_AUTHOR_NAME: OpenClaw Memory Sync
      MEMORY_SYNC_AUTHOR_EMAIL: openclaw-memory-sync@users.noreply.github.com
    volumes:
      - openclaw-workspace:/workspace
      - ../secrets:/run/secrets:ro
    depends_on:
      memory-sync-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  browser:
    image: ghcr.io/browserless/chromium:v2.63.1
    environment:
      TOKEN: ${BROWSER_TOKEN:?Set BROWSER_TOKEN in the Compose environment}
      EXTERNAL: ws://browser:3000
      CONCURRENT: "1"
    init: true
    shm_size: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [browser-network]
    restart: unless-stopped

volumes:
  openclaw-state:
  openclaw-workspace:

networks:
  browser-network:
  services:
    external: true
    name: chief-of-staff-services
