services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw-platform:local
    env_file:
      - .env
    environment:
      OPENCLAW_HOME: /app/.openclaw-home
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      FINANCE_SQLITE_PATH: /app/data/finance.sqlite
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - ./.openclaw-home:/app/.openclaw-home
      - finance-data:/app/data
      - ./config:/app/config:ro
      - ./hooks:/app/hooks:ro
      - ${OPENCLAW_MEMORY_VAULT_PATH:-../openclaw-obsidian-vault}:${OPENCLAW_MEMORY_VAULT_PATH:-/app/openclaw-obsidian-vault}
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./.secrets/service-account.json}:/run/secrets/google-service-account.json:ro
    tty: true
    stdin_open: true
    restart: unless-stopped

  finance-sheet-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw-platform:local
    env_file:
      - .env
    environment:
      OPENCLAW_HOME: /app/.openclaw-home
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      FINANCE_SQLITE_PATH: /app/data/finance.sqlite
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - finance-data:/app/data
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./.secrets/service-account.json}:/run/secrets/google-service-account.json:ro
    command: ["node", "dist/scripts/sync_receipt_sheets.js"]
    restart: unless-stopped

volumes:
  finance-data:
